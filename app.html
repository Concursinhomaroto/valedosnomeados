<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Vale dos Nomeados</title>
<!-- app.html virou app/index.html (URL mais limpa, sem ".html" na barra de endereço).
     Este arquivo continua aqui só pra não quebrar links/favoritos antigos que já
     apontam pra /app.html — redireciona sozinho pra /app/, preservando qualquer
     parâmetro na URL (?plano=..., ?origem=...). -->
<script>
  location.replace('app/' + location.search + location.hash);
</script>
<meta http-equiv="refresh" content="0; url=app/">
</head>
<body>
<p>Redirecionando para <a href="app/">valedosnomeados.com.br/app/</a>...</p>
</body>
</html>
