<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila do Instagram — Vale dos Nomeados</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#170f2b;color:#ede9fe;min-height:100vh;padding:24px 16px 80px;}
  h1{font-size:22px;margin:0 0 4px;color:#f5a623;}
  .sub{color:#a89ac9;font-size:13px;margin-bottom:20px;}
  #key-box{max-width:420px;margin:0 auto 28px;background:#241a3d;border:1px solid #3d2f63;border-radius:12px;padding:18px;}
  #key-box input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3d2f63;background:#170f2b;color:#fff;font-size:14px;margin-bottom:10px;}
  #key-box button{width:100%;padding:10px;border-radius:8px;border:none;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer;font-size:14px;}
  #app{display:none;max-width:1100px;margin:0 auto;}
  .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filters button{padding:7px 14px;border-radius:99px;border:1px solid #3d2f63;background:#241a3d;color:#c4b5fd;font-size:12.5px;font-weight:700;cursor:pointer;}
  .filters button.active{background:#7c3aed;color:#fff;border-color:#7c3aed;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
  .card{background:#1e1536;border:1px solid #3d2f63;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
  .card img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#0f0a1e;}
  .card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .status{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:99px;align-self:flex-start;}
  .status.pending{background:#4b3d1a;color:#fbbf24;}
  .status.approved{background:#1a4b2e;color:#4ade80;}
  .status.rejected{background:#4b1a1a;color:#f87171;}
  .status.published{background:#1a2e4b;color:#60a5fa;}
  .status.failed{background:#4b1a1a;color:#f87171;}
  .cap{font-size:12.5px;color:#c4b5fd;line-height:1.5;white-space:pre-wrap;max-height:110px;overflow-y:auto;}
  .actions{display:flex;gap:6px;margin-top:auto;}
  .actions button{flex:1;padding:8px;border-radius:8px;border:none;font-weight:700;font-size:12px;cursor:pointer;}
  .btn-approve{background:#16a34a;color:#fff;}
  .btn-reject{background:#3d2f63;color:#f87171;}
  .btn-now{background:#f5a623;color:#170f2b;}
  .empty{color:#8b7db8;text-align:center;padding:60px 0;font-size:14px;}
</style>
</head>
<body>
  <h1>🗺️ Fila do Instagram</h1>
  <div class="sub">Vale dos Nomeados — aprova, rejeita ou publica na hora.</div>

  <div id="key-box">
    <input id="worker-url" placeholder="URL do Worker (ex: https://vdn-instagram.leonardobrunotlc.workers.dev)" value="https://vdn-instagram.leonardobrunotlc.workers.dev">
    <input id="admin-key" placeholder="Sua ADMIN_KEY" type="password">
    <button onclick="conectar()">Entrar</button>
  </div>

  <div id="app">
    <div id="add-box" style="max-width:520px;margin:0 auto 24px;background:#241a3d;border:1px solid #3d2f63;border-radius:12px;padding:18px;">
      <div style="font-weight:800;color:#f5a623;margin-bottom:12px;font-size:14px">+ Adicionar à fila</div>
      <select id="add-mediatype" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3d2f63;background:#170f2b;color:#fff;font-size:14px;margin-bottom:10px">
        <option value="VIDEO">🎬 Vídeo (Reel)</option>
        <option value="IMAGE">🖼️ Foto</option>
      </select>
      <input id="add-url" placeholder="URL do vídeo/imagem (https://...)" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3d2f63;background:#170f2b;color:#fff;font-size:14px;margin-bottom:10px">
      <textarea id="add-caption" placeholder="Legenda (com hashtags)" rows="4" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3d2f63;background:#170f2b;color:#fff;font-size:14px;margin-bottom:10px;resize:vertical;font-family:inherit"></textarea>
      <input id="add-kind" placeholder="Categoria (opcional, ex: divulgacao)" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid #3d2f63;background:#170f2b;color:#fff;font-size:14px;margin-bottom:12px">
      <button onclick="adicionar()" style="width:100%;padding:10px;border-radius:8px;border:none;background:#16a34a;color:#fff;font-weight:700;cursor:pointer;font-size:14px">+ Adicionar à fila</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="grid" id="grid"></div>
  </div>

<script>
let WORKER_URL='', ADMIN_KEY='', QUEUE=[], FILTER='all';

function conectar(){
  WORKER_URL = document.getElementById('worker-url').value.trim().replace(/\/$/,'');
  ADMIN_KEY = document.getElementById('admin-key').value.trim();
  if(!WORKER_URL||!ADMIN_KEY) return alert('Preenche a URL do Worker e a ADMIN_KEY');
  localStorage.setItem('vdn_ig_worker', WORKER_URL);
  localStorage.setItem('vdn_ig_key', ADMIN_KEY);
  document.getElementById('key-box').style.display='none';
  document.getElementById('app').style.display='block';
  carregar();
}

async function carregar(){
  const res = await fetch(`${WORKER_URL}/queue?adminKey=${encodeURIComponent(ADMIN_KEY)}`);
  const data = await res.json();
  if(!res.ok){ alert('Erro: '+(data.error||res.status)); return; }
  QUEUE = data.queue || [];
  renderFilters();
  renderGrid();
}

function renderFilters(){
  const counts = {all:QUEUE.length};
  QUEUE.forEach(q=>counts[q.status]=(counts[q.status]||0)+1);
  const labels = {all:'Todos', pending:'Pendentes', approved:'Aprovados', published:'Publicados', rejected:'Rejeitados', failed:'Falhou'};
  const el = document.getElementById('filters');
  el.innerHTML = Object.keys(labels).map(k=>{
    const n = counts[k]||0;
    return `<button class="${FILTER===k?'active':''}" onclick="setFilter('${k}')">${labels[k]} (${n})</button>`;
  }).join('');
}
function setFilter(f){ FILTER=f; renderFilters(); renderGrid(); }

function renderGrid(){
  const list = FILTER==='all' ? QUEUE : QUEUE.filter(q=>q.status===FILTER);
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML = '<div class="empty">Nada aqui.</div>'; return; }
  grid.innerHTML = list.map(item=>`
    <div class="card">
      ${item.mediaType==='VIDEO'
        ? `<video src="${item.videoUrl}" controls muted playsinline preload="metadata" style="width:100%;aspect-ratio:4/5;object-fit:cover;background:#0f0a1e"></video>`
        : `<img src="${item.imageUrl}" loading="lazy">`}
      <div class="card-body">
        <span class="status ${item.status}">${item.status}</span>
        ${item.mediaType==='VIDEO' ? `<span style="font-size:10px;color:#8b7db8">🎬 Reel</span>` : ''}
        <div class="cap">${(item.caption||'').replace(/</g,'&lt;')}</div>
        ${item.status==='pending' ? `
          <div class="actions">
            <button class="btn-approve" onclick="acao('approve','${item.id}')">✓ Aprovar</button>
            <button class="btn-reject" onclick="acao('reject','${item.id}')">✕ Rejeitar</button>
          </div>
          <div class="actions">
            <button class="btn-now" onclick="acao('publish-now','${item.id}')">🚀 Publicar agora</button>
          </div>
        ` : ''}
        ${item.status==='approved' ? `
          <div class="actions">
            <button class="btn-now" onclick="acao('publish-now','${item.id}')">🚀 Publicar agora</button>
          </div>
        ` : ''}
      </div>
    </div>
  `).join('');
}

async function adicionar(){
  const mediaType = document.getElementById('add-mediatype').value;
  const url = document.getElementById('add-url').value.trim();
  const caption = document.getElementById('add-caption').value.trim();
  const kind = document.getElementById('add-kind').value.trim();
  if(!url) return alert('Preenche a URL do vídeo/imagem');
  const body = { adminKey: ADMIN_KEY, mediaType, caption, kind };
  if(mediaType === 'VIDEO') body.videoUrl = url; else body.imageUrl = url;
  const res = await fetch(`${WORKER_URL}/queue/add`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if(!res.ok){ alert('Erro: '+JSON.stringify(data)); return; }
  document.getElementById('add-url').value='';
  document.getElementById('add-caption').value='';
  document.getElementById('add-kind').value='';
  await carregar();
  alert('Adicionado na fila! ✅');
}

async function acao(tipo, id){
  const res = await fetch(`${WORKER_URL}/queue/${tipo}`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, adminKey: ADMIN_KEY})
  });
  const data = await res.json();
  if(!res.ok){ alert('Erro: '+JSON.stringify(data)); return; }
  await carregar();
}

// auto-preenche se já usou antes
window.addEventListener('load', ()=>{
  const w = localStorage.getItem('vdn_ig_worker');
  const k = localStorage.getItem('vdn_ig_key');
  if(w) document.getElementById('worker-url').value = w;
  if(k) document.getElementById('admin-key').value = k;
});
</script>
</body>
</html>
